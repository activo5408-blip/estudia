name: Probar lección de inglés

on:
  workflow_dispatch:
  push:
    paths:
      - "crear_video.py"
      - "lecciones/Prueba.json"
      - ".github/workflows/probar-leccion.yml"

jobs:
  generar-prueba:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg y dependencia visual
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade Pillow

      - name: Renderizar vídeo de prueba sin voz
        run: python crear_video.py lecciones/Prueba.json --sin-voz --720p

      - name: Guardar vídeo y vista previa como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: prueba-ingles-con-sara
          path: |
            salida/Prueba/Prueba.mp4
            salida/Prueba/miniatura.png
            salida/Prueba/descripcion-youtube.txt
            salida/Prueba/sincronizacion.txt
          if-no-files-found: error
