name: Probar lección de inglés

on:
  workflow_dispatch:
  push:
    paths:
      - "crear_video.py"
      - "lecciones/Prueba.json"
      - ".github/workflows/probar-leccion.yml"

jobs:
  generar-prueba:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencia visual
        run: python -m pip install --upgrade Pillow

      - name: Validar formato y generar guion de prueba
        run: python crear_video.py lecciones/Prueba.json --solo-guion --sin-voz

      - name: Guardar resultados para descargar
        uses: actions/upload-artifact@v4
        with:
          name: prueba-ingles-con-sara
          path: salida/Prueba/
          if-no-files-found: error
